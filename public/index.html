<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<title>VYRA AI</title>
<style>
  :root{
    --sidebar-bg:#f7f7f8; --sidebar-hover:#ececec; --sidebar-active:#e5e5e5;
    --main-bg:#ffffff; --text:#1a1a1a; --muted:#6e6e80; --border:#e5e5e5;
    --accent:#10a37f; --bubble-user:#eef2ff; --bubble-ai:#ffffff;
    --pill-bg:#ffffff;
  }
  *{box-sizing:border-box;}
  body{
    margin:0; font-family:'Segoe UI',system-ui,-apple-system,sans-serif;
    background:var(--main-bg); color:var(--text); height:100vh; display:flex; overflow:hidden;
  }

  /* ---------- Sidebar ---------- */
  #sidebar{
    width:260px; min-width:260px; background:var(--sidebar-bg); border-right:1px solid var(--border);
    display:flex; flex-direction:column; height:100%; transition:margin-left .2s ease;
  }
  #sidebar.collapsed{ margin-left:-260px; }
  #sidebarHeader{
    display:flex; align-items:center; justify-content:space-between; padding:12px;
  }
  #sidebarHeader .brand{ font-weight:700; font-size:16px; }
  #sidebarHeader .brand span{ color:var(--accent); }
  #toggleSidebar{
    background:none; border:none; cursor:pointer; font-size:18px; color:var(--muted); padding:6px;
  }
  #newChatBtn{
    margin:4px 12px 8px; padding:10px 12px; border-radius:10px; border:1px solid var(--border);
    background:#fff; cursor:pointer; display:flex; align-items:center; gap:8px;
    font-size:14px; color:var(--text); font-weight:500;
  }
  #newChatBtn:hover{ background:var(--sidebar-hover); }
  #convList{
    flex:1; overflow-y:auto; padding:4px 8px; display:flex; flex-direction:column; gap:2px;
  }
  .convItem{
    padding:9px 10px; border-radius:8px; font-size:13.5px; cursor:pointer;
    white-space:nowrap; overflow:hidden; text-overflow:ellipsis; color:var(--text);
    display:flex; align-items:center; justify-content:space-between; gap:6px;
  }
  .convItem:hover{ background:var(--sidebar-hover); }
  .convItem.active{ background:var(--sidebar-active); }
  .convItem .title{ overflow:hidden; text-overflow:ellipsis; white-space:nowrap; flex:1; }
  .convItem .delBtn{
    opacity:0; border:none; background:none; color:var(--muted); cursor:pointer; font-size:13px;
    flex:0 0 auto;
  }
  .convItem:hover .delBtn{ opacity:1; }
  #sectionLabel{ font-size:11px; color:var(--muted); padding:10px 14px 4px; font-weight:600; }
  #sidebarFooter{
    padding:12px; border-top:1px solid var(--border); font-size:12px; color:var(--muted);
  }

  /* ---------- Main area ---------- */
  #main{
    flex:1; display:flex; flex-direction:column; height:100%; min-width:0;
    background:
      radial-gradient(circle at 12% 8%, rgba(16,163,127,0.08) 0%, transparent 45%),
      radial-gradient(circle at 88% 92%, rgba(99,102,241,0.08) 0%, transparent 45%),
      linear-gradient(180deg, #fbfbfd 0%, #ffffff 100%);
  }
  #topBar{
    display:flex; align-items:center; gap:10px; padding:10px 14px; border-bottom:1px solid var(--border);
  }
  #openSidebarBtn{ display:none; background:none; border:none; font-size:18px; cursor:pointer; color:var(--muted); }
  #topBar .title{ font-weight:600; font-size:15px; }

  #emptyState{
    flex:1; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:22px;
  }
  #emptyState h1{
    font-size:32px; font-weight:700; margin:0;
    background:linear-gradient(90deg, #10a37f, #6366f1);
    -webkit-background-clip:text; background-clip:text; color:transparent;
  }

  #chat{
    flex:1; overflow-y:auto; padding:20px 16px 8px; display:flex; flex-direction:column; gap:16px;
  }
  .msg{ max-width:70%; padding:11px 15px; border-radius:16px; line-height:1.5; white-space:pre-wrap; word-wrap:break-word; font-size:14.5px; }
  .msg.user{ align-self:flex-end; background:var(--bubble-user); border-bottom-right-radius:4px; }
  .msg.ai{ align-self:flex-start; background:var(--bubble-ai); border:1px solid var(--border); box-shadow:0 1px 4px rgba(0,0,0,0.04); border-bottom-left-radius:4px; }
  .msg img{ max-width:220px; border-radius:10px; display:block; margin-top:8px; }
  .msg .fname{ font-size:12px; color:var(--muted); margin-top:4px; }
  .typing{ align-self:flex-start; color:var(--muted); font-size:13px; padding-left:8px; }

  #previewBar{ display:flex; gap:8px; padding:8px 16px; overflow-x:auto; }
  .preview-item{ position:relative; flex:0 0 auto; }
  .preview-item img, .preview-item .filebox{
    width:56px; height:56px; object-fit:cover; border-radius:8px; border:1px solid var(--border);
  }
  .preview-item .filebox{
    display:flex; align-items:center; justify-content:center; background:var(--pill-bg);
    font-size:10px; text-align:center; padding:2px; color:var(--muted);
  }
  .preview-item .rm{
    position:absolute; top:-6px; right:-6px; background:#ef4444; color:#fff;
    border-radius:50%; width:18px; height:18px; font-size:12px; line-height:18px;
    text-align:center; cursor:pointer; border:none;
  }

  /* ---------- Input bar (ChatGPT-style pill) ---------- */
  .inputWrap{ padding:14px 16px 20px; }
  #inputBar{
    max-width:760px; margin:0 auto; display:flex; align-items:center; gap:6px;
    background:var(--pill-bg); border:1px solid var(--border); border-radius:26px; padding:6px 8px 6px 14px;
    box-shadow:0 4px 18px rgba(0,0,0,0.06);
  }
  #inputBar textarea{
    flex:1; border:none; outline:none; background:transparent; color:var(--text); font-size:14.5px;
    padding:8px 4px; font-family:inherit; resize:none; max-height:200px; overflow-y:auto;
    line-height:1.4;
  }
  #inputBar button{
    background:none; border:none; color:var(--muted); font-size:18px; cursor:pointer;
    width:36px; height:36px; border-radius:50%; display:flex; align-items:center; justify-content:center; flex:0 0 auto;
  }
  #inputBar button:hover{ background:#e9e9ec; }
  #sendBtn{ background:#111 !important; color:#fff !important; }
  #sendBtn:hover{ background:#000 !important; }

  #camModal{
    position:fixed; inset:0; background:rgba(0,0,0,.92); display:none;
    flex-direction:column; align-items:center; justify-content:center; z-index:50;
  }
  #camModal.open{ display:flex; }
  #camVideo{ width:min(92vw,420px); border-radius:12px; background:#000; }
  #camControls{ display:flex; gap:20px; margin-top:16px; }
  #camControls button{
    width:52px; height:52px; border-radius:50%; border:none; font-size:20px; cursor:pointer;
  }
  #capBtn{ background:var(--accent); color:#fff; width:64px; height:64px; font-size:24px; }
  #switchCamBtn, #closeCamBtn{ background:#232634; color:#fff; }

  @media (max-width:720px){
    #sidebar{ position:fixed; z-index:40; left:0; top:0; bottom:0; }
    #sidebar.collapsed{ margin-left:-260px; }
    #openSidebarBtn{ display:block; }
    .msg{ max-width:86%; }
  }
</style>
</head>
<body>

<div id="sidebar">
  <div id="sidebarHeader">
    <div class="brand">V<span>Y</span>RA AI</div>
    <button id="toggleSidebar" title="Collapse">«</button>
  </div>
  <button id="newChatBtn">＋ New chat</button>
  <div id="sectionLabel">Recents</div>
  <div id="convList"></div>
  <div id="sidebarFooter">VYRA AI — student project</div>
</div>

<div id="main">
  <div id="topBar">
    <button id="openSidebarBtn" title="Open sidebar">☰</button>
    <div class="title" id="topBarTitle">New chat</div>
  </div>

  <div id="emptyState">
    <h1>Where should we begin?</h1>
  </div>

  <div id="chat" style="display:none;"></div>
  <div id="previewBar" style="display:none;"></div>

  <div class="inputWrap" id="inputWrapBottom">
    <div id="inputBar">
      <button id="fileBtn" title="Attach file">📎</button>
      <input type="file" id="fileInput" multiple hidden />
      <button id="camBtn" title="Camera">📷</button>
      <textarea id="textInput" rows="1" placeholder="Ask anything"></textarea>
      <button id="sendBtn" title="Send">➤</button>
    </div>
  </div>
</div>

<div id="camModal">
  <video id="camVideo" autoplay playsinline></video>
  <div id="camControls">
    <button id="switchCamBtn" title="Switch camera">🔄</button>
    <button id="capBtn" title="Capture">●</button>
    <button id="closeCamBtn" title="Close">✕</button>
  </div>
</div>

<script>
/* ================= elements ================= */
const sidebar = document.getElementById('sidebar');
const toggleSidebarBtn = document.getElementById('toggleSidebar');
const openSidebarBtn = document.getElementById('openSidebarBtn');
const newChatBtn = document.getElementById('newChatBtn');
const convList = document.getElementById('convList');
const topBarTitle = document.getElementById('topBarTitle');

const emptyState = document.getElementById('emptyState');
const chatEl = document.getElementById('chat');
const previewBar = document.getElementById('previewBar');
const inputWrapBottom = document.getElementById('inputWrapBottom');

const textInput = document.getElementById('textInput');
const sendBtn = document.getElementById('sendBtn');
const fileBtn = document.getElementById('fileBtn');
const fileInput = document.getElementById('fileInput');
const camBtn = document.getElementById('camBtn');
const camModal = document.getElementById('camModal');
const camVideo = document.getElementById('camVideo');
const switchCamBtn = document.getElementById('switchCamBtn');
const capBtn = document.getElementById('capBtn');
const closeCamBtn = document.getElementById('closeCamBtn');

let pendingFiles = [];
let camStream = null;
let facingMode = 'user';

let conversations = [];        // [{id,title,messages,updatedAt}]
let activeConvId = null;       // null = unsaved "new chat"
let activeMessages = [];       // messages of the currently open conversation

/* ================= IndexedDB (multi-conversation) ================= */
const DB_NAME = 'vyra-db';
const STORE_NAME = 'conversations';
let dbPromise = null;

function openDB(){
  if (dbPromise) return dbPromise;
  dbPromise = new Promise((resolve, reject) => {
    const req = indexedDB.open(DB_NAME, 2);
    req.onupgradeneeded = () => {
      const db = req.result;
      if (!db.objectStoreNames.contains(STORE_NAME)){
        db.createObjectStore(STORE_NAME, { keyPath: 'id' });
      }
    };
    req.onsuccess = () => resolve(req.result);
    req.onerror = () => reject(req.error);
  });
  return dbPromise;
}

async function getAllConversations(){
  const db = await openDB();
  return new Promise((res, rej) => {
    const tx = db.transaction(STORE_NAME, 'readonly');
    const req = tx.objectStore(STORE_NAME).getAll();
    req.onsuccess = () => res(req.result || []);
    req.onerror = () => rej(req.error);
  });
}
async function putConversation(conv){
  const db = await openDB();
  return new Promise((res, rej) => {
    const tx = db.transaction(STORE_NAME, 'readwrite');
    tx.objectStore(STORE_NAME).put(conv);
    tx.oncomplete = () => res();
    tx.onerror = () => rej(tx.error);
  });
}
async function deleteConversationDB(id){
  const db = await openDB();
  return new Promise((res, rej) => {
    const tx = db.transaction(STORE_NAME, 'readwrite');
    tx.objectStore(STORE_NAME).delete(id);
    tx.oncomplete = () => res();
    tx.onerror = () => rej(tx.error);
  });
}

/* ================= sidebar rendering ================= */
async function refreshSidebar(){
  conversations = await getAllConversations();
  conversations.sort((a, b) => b.updatedAt - a.updatedAt);
  convList.innerHTML = '';
  conversations.forEach(c => {
    const item = document.createElement('div');
    item.className = 'convItem' + (c.id === activeConvId ? ' active' : '');
    const title = document.createElement('div');
    title.className = 'title';
    title.textContent = c.title || 'New chat';
    const del = document.createElement('button');
    del.className = 'delBtn';
    del.textContent = '🗑';
    del.title = 'Delete chat';
    del.onclick = async (e) => {
      e.stopPropagation();
      if (!confirm('Delete this chat?')) return;
      await deleteConversationDB(c.id);
      if (activeConvId === c.id) startNewChat();
      await refreshSidebar();
    };
    item.appendChild(title);
    item.appendChild(del);
    item.onclick = () => openConversation(c.id);
    convList.appendChild(item);
  });
}

/* ================= chat view state ================= */
function showEmptyState(){
  emptyState.style.display = 'flex';
  chatEl.style.display = 'none';
}
function showChatState(){
  emptyState.style.display = 'none';
  chatEl.style.display = 'flex';
}

function startNewChat(){
  activeConvId = null;
  activeMessages = [];
  pendingFiles = [];
  chatEl.innerHTML = '';
  topBarTitle.textContent = 'New chat';
  showEmptyState();
  renderPreview();
  closeSidebarOnMobile();
  refreshSidebar();
}

async function openConversation(id){
  const conv = conversations.find(c => c.id === id);
  if (!conv) return;
  activeConvId = conv.id;
  activeMessages = conv.messages || [];
  chatEl.innerHTML = '';
  activeMessages.forEach(m => renderMessage(m.role, m.content, m.files || []));
  topBarTitle.textContent = conv.title || 'New chat';
  showChatState();
  await refreshSidebar();
  closeSidebarOnMobile();
  chatEl.scrollTop = chatEl.scrollHeight;
}

async function persistActiveConversation(){
  if (!activeConvId){
    activeConvId = 'c_' + Date.now() + '_' + Math.random().toString(36).slice(2, 7);
  }
  const firstUserMsg = activeMessages.find(m => m.role === 'user' && m.content);
  const title = firstUserMsg ? firstUserMsg.content.slice(0, 40) : 'New chat';
  const conv = { id: activeConvId, title, messages: activeMessages, updatedAt: Date.now() };
  await putConversation(conv);
  topBarTitle.textContent = title;
  await refreshSidebar();
}

/* ================= rendering messages ================= */
function renderMessage(role, content, files){
  const div = document.createElement('div');
  div.className = 'msg ' + (role === 'user' ? 'user' : 'ai');
  if (content) div.appendChild(document.createTextNode(content));
  (files||[]).forEach(f => {
    if (f.mimeType && f.mimeType.startsWith('image/') && f.data){
      const img = document.createElement('img');
      img.src = `data:${f.mimeType};base64,${f.data}`;
      div.appendChild(img);
    } else {
      const p = document.createElement('div');
      p.className = 'fname';
      p.textContent = '📄 ' + (f.name || 'file');
      div.appendChild(p);
    }
  });
  chatEl.appendChild(div);
  chatEl.scrollTop = chatEl.scrollHeight;
}
function showTyping(){
  const d = document.createElement('div');
  d.className = 'typing'; d.id = 'typingIndicator'; d.textContent = 'VYRA is typing...';
  chatEl.appendChild(d); chatEl.scrollTop = chatEl.scrollHeight;
}
function hideTyping(){
  const d = document.getElementById('typingIndicator');
  if (d) d.remove();
}

/* ================= file attach ================= */
fileBtn.onclick = () => fileInput.click();
fileInput.onchange = async (e) => {
  for (const file of e.target.files){
    const base64 = await fileToBase64(file);
    pendingFiles.push({ data: base64, mimeType: file.type || 'application/octet-stream', name: file.name });
  }
  fileInput.value = '';
  renderPreview();
};
function fileToBase64(file){
  return new Promise((res, rej) => {
    const r = new FileReader();
    r.onload = () => res(r.result.split(',')[1]);
    r.onerror = rej;
    r.readAsDataURL(file);
  });
}
function renderPreview(){
  previewBar.innerHTML = '';
  previewBar.style.display = pendingFiles.length ? 'flex' : 'none';
  pendingFiles.forEach((f, i) => {
    const wrap = document.createElement('div');
    wrap.className = 'preview-item';
    if (f.mimeType.startsWith('image/')){
      const img = document.createElement('img');
      img.src = `data:${f.mimeType};base64,${f.data}`;
      wrap.appendChild(img);
    } else {
      const box = document.createElement('div');
      box.className = 'filebox';
      box.textContent = f.name.slice(0, 10);
      wrap.appendChild(box);
    }
    const rm = document.createElement('button');
    rm.className = 'rm'; rm.textContent = '×';
    rm.onclick = () => { pendingFiles.splice(i,1); renderPreview(); };
    wrap.appendChild(rm);
    previewBar.appendChild(wrap);
  });
}

/* ================= camera (front/back) ================= */
camBtn.onclick = () => openCamera();
closeCamBtn.onclick = () => closeCamera();

async function openCamera(){
  camModal.classList.add('open');
  await startStream(facingMode);
}
async function getDeviceIdForFacing(mode){
  try{
    const devices = await navigator.mediaDevices.enumerateDevices();
    const cams = devices.filter(d => d.kind === 'videoinput');
    if (cams.length < 2) return null;
    const wantBack = mode === 'environment';
    let match = cams.find(d => {
      const label = d.label.toLowerCase();
      return wantBack
        ? (label.includes('back') || label.includes('rear') || label.includes('environment'))
        : (label.includes('front') || label.includes('user') || label.includes('face'));
    });
    if (!match) match = wantBack ? cams[cams.length - 1] : cams[0];
    return match ? match.deviceId : null;
  }catch(e){ return null; }
}
async function startStream(mode){
  stopStream();
  await new Promise(r => setTimeout(r, 150));
  const deviceId = await getDeviceIdForFacing(mode);
  const attempts = [];
  if (deviceId) attempts.push({ video: { deviceId: { exact: deviceId } }, audio: false });
  attempts.push({ video: { facingMode: { exact: mode } }, audio: false });
  attempts.push({ video: { facingMode: mode }, audio: false });
  attempts.push({ video: true, audio: false });

  let lastErr = null;
  for (const constraints of attempts){
    try{
      camStream = await navigator.mediaDevices.getUserMedia(constraints);
      camVideo.srcObject = camStream;
      return;
    }catch(err){ lastErr = err; }
  }
  alert('Camera access failed: ' + (lastErr ? lastErr.message : 'unknown error') +
        (mode === 'environment' ? '\n(This device may not have a back camera.)' : ''));
  closeCamera();
}
function stopStream(){
  if (camStream){ camStream.getTracks().forEach(t => t.stop()); camStream = null; }
}
function closeCamera(){ stopStream(); camModal.classList.remove('open'); }
switchCamBtn.onclick = () => {
  facingMode = facingMode === 'user' ? 'environment' : 'user';
  startStream(facingMode);
};
capBtn.onclick = () => {
  const canvas = document.createElement('canvas');
  canvas.width = camVideo.videoWidth;
  canvas.height = camVideo.videoHeight;
  canvas.getContext('2d').drawImage(camVideo, 0, 0);
  const dataUrl = canvas.toDataURL('image/jpeg', 0.9);
  const base64 = dataUrl.split(',')[1];
  pendingFiles.push({ data: base64, mimeType: 'image/jpeg', name: `camera_${Date.now()}.jpg` });
  renderPreview();
  closeCamera();
};

/* ================= send message ================= */
sendBtn.onclick = sendMessage;
textInput.addEventListener('keydown', (e) => {
  if (e.key === 'Enter' && !e.shiftKey){
    e.preventDefault();
    sendMessage();
  }
});
textInput.addEventListener('input', () => {
  textInput.style.height = 'auto';
  textInput.style.height = Math.min(textInput.scrollHeight, 200) + 'px';
});

async function sendMessage(){
  const text = textInput.value.trim();
  if (!text && pendingFiles.length === 0) return;

  if (emptyState.style.display !== 'none') showChatState();

  const userMsg = { role: 'user', content: text, files: pendingFiles };
  activeMessages.push(userMsg);
  renderMessage('user', text, pendingFiles);
  await persistActiveConversation();

  textInput.value = '';
  textInput.style.height = 'auto';
  pendingFiles = [];
  renderPreview();
  showTyping();

  try{
    const res = await fetch('/api/chat', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ messages: activeMessages })
    });
    const data = await res.json();
    hideTyping();

    if (data.error){
      renderMessage('assistant', '⚠️ ' + data.error, []);
      return;
    }
    const aiMsg = { role: 'assistant', content: data.reply, files: [] };
    activeMessages.push(aiMsg);
    renderMessage('assistant', data.reply, []);
    await persistActiveConversation();
  }catch(err){
    hideTyping();
    renderMessage('assistant', '⚠️ Network error: ' + err.message, []);
  }
}

/* ================= sidebar toggle ================= */
toggleSidebarBtn.onclick = () => sidebar.classList.add('collapsed');
openSidebarBtn.onclick = () => sidebar.classList.remove('collapsed');
function closeSidebarOnMobile(){
  if (window.innerWidth <= 720) sidebar.classList.add('collapsed');
}
newChatBtn.onclick = () => startNewChat();

/* ================= init ================= */
(async function init(){
  await refreshSidebar();
  startNewChat();
  if (window.innerWidth <= 720) sidebar.classList.add('collapsed');
})();
</script>
</body>
</html>
